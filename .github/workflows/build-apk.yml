name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Add storage permission to manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
          fi
          if ! grep -q "requestLegacyExternalStorage" "$MANIFEST"; then
            sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' "$MANIFEST"
          fi

      - name: Generate app icon from custom image
        run: |
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#0e0c14' --iconBackgroundColorDark '#0e0c14'
          else
            echo "مفيش صورة أيقونة مخصصة (assets/icon.png)، هنستخدم الافتراضية"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
